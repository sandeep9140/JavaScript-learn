<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //&& operator
        console.log(5>2 && 5<6);//true
        console.log(5>2 || 5>6);//true
        console.log(5>2 && 5<6);//true
        console.log(!(5>2 && 5<6));//false
    </script>
</body>
</html>
