<body>
    /*
    DOM  is a programming interface of the browser which convert html code into object 
     document ->element ->attributes->textNode

     document  -> html  -> body -> div -> h1 -> hello
    */

    <h1>hello</h1>//html 

    //DOm evrything is represent via object
    {
        tagName:"h1",
        innerText: "hello"
    }
</body>
