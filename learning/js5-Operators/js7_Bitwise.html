<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        &  bit and 
        |  bit or
        ^  bit XOR
        ~  bit Not
        << bit Left shift
        >> bit right shift
        */

        let a=5;
        let b=3;
        console.log(a&b);//1
        console.log(a|b);//7
        console.log(a^b);//0101 + 0011 =0110=>6
        console.log(~b);//0011 =>-(n+1) ==>  -(3+1)=== -4
        console.log(a<<1);//00000101==>00001010====>10
        console.log(a>>1);//00000101=00000010==>2
        
    </script>
</body>
</html>
