<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //push()
    //add element end of the array
        const arr1=[10,20,30];
        const arr2=arr1.push(30,40);
        console.log(arr1);
        console.log(arr2);


    //pop()
    // remove element end of the the array
        const arr3=[10,20,30];
        const arr4=arr3.pop();
        console.log(arr3);
        console.log(arr4)

    

    //shift()
    //remove first elemwnt
        const arr5=[10,20,30];
        const arr6=arr5.shift();
        console.log(arr5);
        console.log(arr6)


    //unshift()
    //add elemnt in array at starting
           const arr7=[10,20,30];
        const arr8=arr7.unshift(10);
        console.log(arr7);
        console.log(arr8)

    

    //map()
    //perform operation with each elemnt 
    let nums=[1,2,3];
    let result=nums.map(num=>num*2);
    console.log(result)

    </script>
</body>
</html>
