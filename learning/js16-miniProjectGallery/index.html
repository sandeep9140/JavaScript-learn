<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Image Gallery</h1>

    <!-- Gallery -->
    <div id="gallery">

        <img src="https://picsum.photos/id/1015/300/200"
             alt="Image 1"
             class="gallery-img">

        <img src="https://picsum.photos/id/1016/300/200"
             alt="Image 2"
             class="gallery-img">

        <img src="https://picsum.photos/id/1025/300/200"
             alt="Image 3"
             class="gallery-img">

        <img src="https://picsum.photos/id/1035/300/200"
             alt="Image 4"
             class="gallery-img">

        <img src="https://picsum.photos/id/1043/300/200"
             alt="Image 5"
             class="gallery-img">

        <img src="https://picsum.photos/id/1069/300/200"
             alt="Image 6"
             class="gallery-img">

    </div>


    <!-- Modal -->
    <div id="modal">

        <div id="modal-content">

            <button id="closeBtn">&times;</button>

            <img id="modal-img"
                 src=""
                 alt="Large Image">

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
